# Every level generator setting, with its built-in value or an example.  Copy what you need; leave the rest out.
# The same names work on the command line: an option (--gap 2-3) or --set NAME=VALUE (--set tier.3.riders=2).
#
#   uv run python -m platformer_ai.levelgen --config docs/levelgen/example.toml --print-settings

# ---- what to write ----
out = "gen"                 # folder for train/ and test/ (and settings.toml)
seed = 0                    # training set seed
train = 300                 # training levels
test = 60                   # held-out levels
# test_seed = 1000003       # held-out set seed (default: seed + 1000003)
verify = true               # play every level with the beatability search, replace the ones it cannot finish

# ---- which tiers ----
tiers = { 1 = 1, 2 = 1, 3 = 1 }   # shares; [3] = only tier 3; { 2 = 1, 3 = 2 } = a third tier 2, two thirds tier 3

# ---- generation settings: here = every tier; in [tier.N] = one tier; in [test_set] = the held-out set ----
# width = [40, 80]          # level width in tiles (built-in: 40-55 / 50-70 / 60-80 by tier)
# height = [10, 12]         # level height (8-40)
# gap = [1, 3]              # pit width (1-4; built-in 1-2 / 1-3 / 2-3)
# stone_gap = [2, 3]        # gaps between stepping stones (1-3; built-in 2-2 / 2-2 / 2-3)
# max_step = 2              # highest step up (0-2; built-in 1 / 2 / 2)
# max_enemies = 4           # at most this many enemies per level (built-in: no limit)
# only = ["gap", "enemy"]   # use only these kinds
# without = ["stones"]      # never use these kinds
# coins = 1.0               # coin amount (0 = none, 2 = about twice as many)
# riders = 1.0              # enemies on ledges / riding platforms (built-in 0 / 0 / 1; 1 = the tier-3 amount)
# pairs = 0.4               # chance of two enemies on one stretch (built-in 0 / 0 / 0.4)
# narrow_stones = 0.3       # chance of 1-tile stepping stones (built-in 0 / 0 / 0.3)
# weight = { enemy = 2, gap = 0.5 }   # how often a kind is picked, times its built-in weight (0 = never)
# limit = { ferry = 2 }               # at most N of a kind per level (built-in: enemy 1 + ferry 1 / ferry 2 / ferry 3)
# min = { ferry = 1 }                 # at least N of a kind per level
#
# Kinds: flat, step, gap, enemy, ledge, ferry, stones, upper (python -m platformer_ai.levelgen --help)

# [tier.3]
# riders = 2

# [test_set]                # the held-out set only (also tiers); [test_set.tier.N] for one of its tiers
# tiers = [3]
