[project]
name = "platformer-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "plant7-arch", email = "230461642+plant7-arch@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chex>=0.1.92",
    "flax>=0.12.10",
    "jax[cuda13]>=0.11.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "optax>=0.2.8",
    "orbax-checkpoint>=0.12.7",
    "pillow>=12.3.0",
    "pygame>=2.6.1",
    "tensorboard>=2.21.0",
]

[project.scripts]
platformer-ai = "platformer_ai:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
